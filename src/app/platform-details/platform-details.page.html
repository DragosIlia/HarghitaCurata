<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Informații platformă</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="dismiss()">
        <ion-icon name="close-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding fade-in-image" fullscreen="true">
  <div class="chip-container">
    <ion-chip class="custom-chip">
      <ion-label>{{ platformName }}</ion-label>
    </ion-chip>
  </div>
  
  <div *ngFor="let fraction of fractions" class="fraction-card" [style.background]="fraction.color">
    <div class="fraction-title">{{ fraction.name }}</div>
    <div class="bar-container">
      <div class="bar-fill" [style.width.%]="fraction.percentage" [ngClass]="{ 'danger': fraction.percentage > 80 }" [class.filled]="fraction.percentage > 0"></div>
      <span class="bar-label">{{ fraction.percentage }}%</span>
    </div>
    <div class="fraction-details">
      {{ fraction.capacity }}
    </div>
    <div class="fraction-status">
      <ion-icon name="thermometer-outline"></ion-icon>
      <span>Temperature: {{ fraction.temperature }}°C</span>
    </div>
    <div class="fraction-status">
        <ion-icon name="battery-half-outline"></ion-icon>
        <span>Battery: {{ fraction.battery }}V</span>
    </div>
  </div>
</ion-content>
