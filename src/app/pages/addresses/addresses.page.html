<app-header iconName="arrow-back-outline" title="Addresses.Title" [enableTitle]="true" [isModal]="true"></app-header>

<ion-content>
    <div class="content">
        <ion-button class="mainButton" (click)="addNewAddress()">
            <p class="text-ellipsis">{{ 'Addresses.Add' | translate }}</p>
            <!-- <ion-icon name="add-circle-outline"></ion-icon> -->
        </ion-button>

        <ng-container *ngIf="addresses !== null && addresses.length !== 0; else noAddresses">
            <ion-card *ngFor="let address of sortBy('main')">

                <div class="actions">
                    <ion-icon button class="mark" name="checkmark-circle-outline"
                        (click)="setActiveAddress(address)" *ngIf="!address.main"></ion-icon>
                    <ion-icon button class="delete" name="trash-outline"
                        (click)="promptDeleteAddress(address)"></ion-icon>
                </div>


                <ion-card-header>
                    <ion-card-title [ngClass]="address.main ? 'main_address' : 'secondary_address'">
                        <ion-icon [name]="address.liveInBlock ? 'business-outline' : 'home-outline'"></ion-icon>
                        {{ address.main ? ('Addresses.Main' | translate) : ('Addresses.Secondary' | translate) }}
                    </ion-card-title>
                    <ion-card-subtitle>{{ address.city }}, Romania</ion-card-subtitle>
                </ion-card-header>

                <ion-card-content>{{ address.street }}, {{ address.streetNumber }}</ion-card-content>
            </ion-card>
        </ng-container>
        <ng-template #noAddresses>
            <app-no-array content="Addresses.NoRecords" [hasPadding]="false"></app-no-array>
        </ng-template>
    </div>
</ion-content>
