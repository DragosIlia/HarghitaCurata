<ion-content>
    <div class="map fade-in-image">
        <!-- <div *ngIf="isLoading" class="loading-container">
            <ion-spinner color="primary"></ion-spinner>
        </div> -->
        
        <div class="mapContent fade-in-image">
            <capacitor-google-map #map></capacitor-google-map>
        </div>

        <div class="nearestPoints" slot="fixed" *ngIf="nearestCentres && nearestCentres.length > 0" [ngClass]="{'closed': !nearestCentresEnable}">
            <div class="nearestPoint__top" (click)="toggleCentres()">
                <h1 class="text-ellipsis">{{ 'Tabs.Map.NearbyCentres' | translate }} ({{ nearestCentres.length }})</h1>
                <ion-icon [name]="nearestCentresEnable ? 'caret-up-outline' : 'caret-down-outline'"></ion-icon>
            </div>
            <div class="nearestPoint__bottom">
                <div class="nearestPoint" *ngFor="let nearestCentre of nearestCentres">
                    <div class="nearestPoint__left" (click)="moveCameraToCentre(nearestCentre)">
                        <div class="icon">
                            <ion-icon name="business-outline"></ion-icon>
                        </div>
                        <div class="group">
                            <h1 class="text-ellipsis">
                                <ng-container *ngIf="currentLanguage === 'ro';else nameGb">
                                    {{ nearestCentre.name }}
                                </ng-container>
                                <ng-template #nameGb>
                                    <ng-container *ngIf="currentLanguage === 'gb';else nameHu">
                                        {{ nearestCentre.nameGb }}
                                    </ng-container>
                                </ng-template>
                                <ng-template #nameHu>
                                    {{ nearestCentre.nameHu }}
                                </ng-template>
                            </h1>
                            <p class="text-ellipsis">
                                <ng-container *ngIf="nearestCentre.distance > 500; else next_metres">
                                    {{ (nearestCentre.distance / 1000).toFixed(1) }} km
                                </ng-container>
                                <ng-template #next_metres>
                                    {{ nearestCentre.distance.toFixed(0) }} m
                                </ng-template>
                            </p>
                        </div>
                    </div>
                    <div class="nearestPoint__right" (click)="navigateToCentre(nearestCentre)">
                        <ion-icon name="navigate-circle-outline"></ion-icon>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <ion-fab slot="fixed" vertical="bottom" horizontal="end" class="map-action-fab filter-fab">
        <ion-fab-button (click)="enableFiltering($event)" *ngIf="map">
            <ion-icon name="filter-circle-outline"></ion-icon>
        </ion-fab-button>
    </ion-fab>
    <ion-fab slot="fixed" vertical="bottom" horizontal="start" class="map-action-fab location-fab">
        <ion-fab-button (click)="goToCurrentLocation($event)" *ngIf="map && isIOS">
            <ion-icon name="locate-outline"></ion-icon>
        </ion-fab-button>
    </ion-fab>
</ion-content>
