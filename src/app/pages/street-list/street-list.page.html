<app-header iconName="arrow-back-outline" title="Address.StreetList" [enableTitle]="true" [isModal]="true"></app-header>

<ion-content>
    <div class="content">
        <ion-searchbar inputmode="text" placeholder="" spellcheck="false" type="text"
            placeholder="{{ 'Placeholder.Filter' | translate }}" (ionChange)="filter($any($event))">
        </ion-searchbar>
        <ion-item *ngFor="let street of streets" (click)="selectStreet(street)">
            <ion-label>{{ street.name }}</ion-label>
            <ion-checkbox slot="end" [ngModel]="street.id === data.streetId"></ion-checkbox>
        </ion-item>
        <ion-infinite-scroll (ionInfinite)="onIonInfinite($event)">
            <ion-infinite-scroll-content loadingSpinner="crescent"></ion-infinite-scroll-content>
        </ion-infinite-scroll>
    </div>
</ion-content>
